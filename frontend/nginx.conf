# Serves the built dashboard and proxies /api/* to the backend container, the
# same relative-path convention the Vite dev server's proxy uses (see
# vite.config.js) - the frontend code never needs to know which mode it's
# running in.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # `backend` is the Docker Compose service name, resolved via Docker's
    # embedded DNS - both prefixes are "/api/", so this is a transparent
    # passthrough (e.g. /api/health -> http://backend:8000/api/health).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Workers and their shell metadata must be rechecked after each deployment.
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite fingerprints these filenames on every build, so a far-future cache
    # is safe: a new build means a new filename, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No client-side router today, but this is the standard safe default for a
    # single-page app - any deep link falls back to index.html instead of a
    # raw nginx 404.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
